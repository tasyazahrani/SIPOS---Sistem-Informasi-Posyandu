{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Super Admin SIPOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style> * { font-family: 'Montserrat', sans-serif; } body { background-color: #fcf9f4; } </style>
</head>
<body class="bg-[#fcf9f4] flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-2xl border border-[#e5e2dd] p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-[#ffdad3] rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="material-symbols-outlined text-[#a93620] text-3xl">key</span>
            </div>
            <h2 class="text-2xl font-bold text-[#1c1c19]">Reset Password</h2>
            <p class="text-sm text-[#58413d] mt-1">Reset password untuk user <strong>{{ user.username }}</strong></p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="mb-4 p-3 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password Baru <span class="text-red-500">*</span></label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
                    <input type="password" name="new_password" id="password" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#a93620] outline-none"
                           placeholder="Minimal 8 karakter">
                </div>
                <p class="text-xs text-gray-500 mt-1">Password harus minimal 8 karakter</p>
            </div>

            <div class="flex gap-3">
                <a href="{% url 'superadmin:manajemen_user' %}" class="flex-1 text-center px-4 py-2 border border-[#dfbfb9] rounded-xl hover:bg-[#f6f3ee] transition">Batal</a>
                <button type="submit" class="flex-1 bg-[#a93620] hover:bg-[#881f0b] text-white font-semibold py-2 rounded-xl transition">Reset Password</button>
            </div>
        </form>
    </div>
</body>
</html>
