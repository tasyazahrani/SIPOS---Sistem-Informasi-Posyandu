{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Akun - Super Admin SIPOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Montserrat', sans-serif; }
        body { background-color: #fcf9f4; }
        .btn-primary { background-color: #a93620; color: white; font-weight: 600; border-radius: 12px; transition: all 0.2s ease; }
        .btn-primary:hover { background-color: #881f0b; }
        .form-input { border-radius: 12px; border: 1px solid #dfbfb9; transition: all 0.2s ease; }
        .form-input:focus { outline: none; border-color: #a93620; box-shadow: 0 0 0 3px rgba(169, 54, 32, 0.2); }
    </style>
</head>
<body class="bg-[#fcf9f4] flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-2xl border border-[#e5e2dd] p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-[#ffdad3] rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="material-symbols-outlined text-[#a93620] text-3xl">settings</span>
            </div>
            <h2 class="text-2xl font-bold text-[#1c1c19]">Pengaturan Akun</h2>
            <p class="text-sm text-[#58413d] mt-1">Kelola informasi akun Anda</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="mb-4 p-3 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">person</span>
                    <input type="text" value="{{ user.username }}" disabled
                           class="w-full pl-10 pr-4 py-2.5 bg-gray-100 border border-gray-200 rounded-xl cursor-not-allowed">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Lengkap</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">badge</span>
                    <input type="text" name="first_name" value="{{ user.first_name|default:'' }}"
                           class="form-input w-full pl-10 pr-4 py-2.5 rounded-xl">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">mail</span>
                    <input type="email" name="email" value="{{ user.email|default:'' }}"
                           class="form-input w-full pl-10 pr-4 py-2.5 rounded-xl">
                </div>
            </div>

            <button type="submit" class="w-full bg-[#a93620] hover:bg-[#881f0b] text-white font-semibold py-3 rounded-xl transition">
                Simpan Perubahan
            </button>

            <div class="mt-4 text-center">
                <a href="{% url 'superadmin:dashboard' %}" class="text-sm text-[#58413d] hover:text-[#a93620]">Kembali ke Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>
